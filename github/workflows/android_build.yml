name: Build Android APK
on: [push] # Tự động chạy mỗi khi bạn đẩy code mới lên

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3 # Lấy toàn bộ file main.js, index.html...

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova # Công cụ đóng gói App

      - name: Setup Android Platform
        run: |
          cordova platform add android
          # Thiết lập tên App dựa trên config.xml bạn đã tạo

      - name: Build APK
        run: cordova build android --release --verbose

      - name: Save APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Vector-GL2-App
          path: platforms/android/app/build/outputs/apk/release/*.apk
          
