Tên : Xây dựng tệp APK Android
trên : [đẩy]

việc làm :
  xây dựng :
    chạy trên : ubuntu-latest
    các bước :
      - sử dụng : actions/checkout@v4

      - Tên : Cài đặt Java JDK
        Sử dụng : actions/setup-java@v4
        với :
          phiên bản java : ' 17 '
          phân phối : ' temurin '

      - tên : Cài đặt Cordova
        Chạy lệnh : `npm install -g cordova`

      - Tên : Tạo dự án và xây dựng
        chạy : |
          cordova create myApp com.vector.gl2 VectorGL2
          cp index.html main.js constants.js config.xml myApp/www/
          cp -r *.js myApp/www/
          cd myApp
          cordova platform add android
          cordova build android --release
